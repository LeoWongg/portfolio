<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Leo Wong's personal site and data visualization portfolio.">
  <title>Leo Wong: Personal site and portfolio</title>
  <link rel="stylesheet" href="style.css">
  <script src="global.js" type="module"></script>
  <script src="index.js" type="module"></script>
</head>
<body>
  <main>
    <header class="intro">
      <div>
        <p class="eyebrow">Personal site &amp; portfolio</p>
        <h1>Leo Wong</h1>
        <p class="intro-text">Welcome to my portfolio.</p>
      </div>
      <img class="profile-photo" src="images/profile.png" alt="LeoWongg's GitHub profile image" width="160" height="160">
    </header>
    <section aria-labelledby="latest-heading">
      <div class="section-heading">
        <h2 id="latest-heading">Latest Projects</h2>
        <a href="projects/">All projects →</a>
      </div>
      <div class="projects" aria-live="polite">Loading projects…</div>
    </section>
    <section class="github-section" aria-labelledby="github-heading">
      <h2 id="github-heading">GitHub Stats</h2>
      <p>Live public activity for <a href="https://github.com/LeoWongg">@LeoWongg</a>.</p>
      <div id="profile-stats" aria-live="polite">Loading GitHub stats…</div>
    </section>
    <noscript>Please enable JavaScript to load projects, GitHub stats, and navigation.</noscript>
  </main>
  <footer>Leo Wong · DSC 106</footer>
</body>
</html>
